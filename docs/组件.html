<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QPhone 组件</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f6f3; --fg:#1c1917; --muted:#57534e; --card:#fff; --border:#e7e5e4; --accent:#0f766e; --code:#f5f5f4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14120e; --fg:#f5f5f4; --muted:#a8a29e; --card:#1c1917; --border:#44403c; --accent:#5eead4; --code:#292524; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 "Iowan Old Style", Palatino, "Songti SC", serif; }
  main { max-width:820px; margin:0 auto; padding:36px 28px 72px; }
  h1 { font-size:32px; line-height:1.2; margin:0 0 8px; }
  h2 { font-size:22px; margin:2em 0 .6em; padding-top:.6em; border-top:1px solid var(--border); }
  a { color:var(--accent); }
  blockquote { margin:1em 0; padding:10px 14px; border-left:3px solid var(--accent); color:var(--muted); background:var(--card); }
  table { width:100%; border-collapse:collapse; margin:1em 0; font-size:14px; line-height:1.45; background:var(--card); }
  th, td { border:1px solid var(--border); padding:8px 10px; vertical-align:top; text-align:left; }
  th { background:var(--code); }
  .nav { display:flex; gap:10px; margin:18px 0 8px; font-family:ui-sans-serif, system-ui, sans-serif; font-size:13px; }
  .nav a { text-decoration:none; border:1px solid var(--border); background:var(--card); padding:6px 10px; border-radius:999px; }
  .arch { margin:16px 0 8px; display:grid; gap:12px; font-family:ui-sans-serif, system-ui, sans-serif; }
  .box { border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--card); }
  .env { border-color:#b45309; }
  .client { border-color:#0e7490; }
  .vm { margin-top:8px; }
  .tag { font-size:12px; letter-spacing:.04em; color:var(--muted); margin-bottom:8px; }
  .env > .tag { color:#b45309; }
  .client > .tag { color:#0e7490; }
  .card { border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:var(--bg); }
  .card b { display:block; font-size:15px; }
  .card span { display:block; color:var(--muted); font-size:13px; line-height:1.4; margin-top:2px; }
  .phone { border-color:#c2410c; }
  .phone b { color:#c2410c; }
  .ghost { margin-top:8px; border-style:dashed; }
  .row { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:center; }
  .arrow { text-align:center; color:var(--accent); font-size:18px; }
  .chan { text-align:center; color:var(--accent); font-size:13px; font-family:ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<main>
<h1>QPhone 组件</h1>
<p>客户端在自己这边。云机是 Ubuntu 里的一部 redroid。环境是现有远程 Windows。</p>

<figure class="arch">
  <div class="box client">
    <div class="tag">客户端</div>
    <div class="card">
      <b>用户</b>
      <span>讲一句。做完或卡住才看屏幕。</span>
    </div>
    <div class="arrow">↓</div>
    <div class="card">
      <b>桌面</b>
      <span>薄壳：只发交代、只收结果。形态未定，不写死平台。</span>
    </div>
  </div>
  <div class="chan">POST /turn + 事件流<br>progress · needs_human · result · status</div>
  <div class="box env">
    <div class="tag">环境 · 现有远程 Windows</div>
    <div class="box vm">
      <div class="tag">VMware 里的 Ubuntu 虚拟机</div>
      <div class="row">
        <div class="card">
          <b>Mobilerun</b>
          <span>在这台虚拟机里点、装、看屏幕。</span>
        </div>
        <div class="arrow">→</div>
        <div class="card phone">
          <b>redroid</b>
          <span>云机。一部云 Android。数据盘独立。</span>
        </div>
      </div>
      <div class="card ghost">
        <b>A9</b>
        <span>同一台虚拟机，只作对照。</span>
      </div>
    </div>
  </div>
</figure>

<p><a href="详细设计.html">回设计</a></p>
</main>
</body>
</html>
