<!DOCTYPE html>

<title>QPhone 结构 · 执行分层</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #020617;
    color: #e2e8f0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  header { padding: 28px 32px 8px; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
  h1 .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #34d399; margin-right: 10px;
    box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
  }
  .sub { margin: 8px 0 0; color: #94a3b8; font-size: 12px; }
  .frame {
    margin: 16px 24px 8px;
    border: 1px solid #1e293b;
    border-radius: 12px;
    background: #020617;
    overflow: auto;
  }
  svg { display: block; min-width: 980px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 8px 24px 28px;
  }
  .card {
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 14px 16px;
    background: #0f172a;
  }
  .card h3 { margin: 0 0 8px; font-size: 12px; }
  .card ul { margin: 0; padding: 0; list-style: none; color: #cbd5e1; font-size: 11px; line-height: 1.7; }
  .cyan { color: #22d3ee; }
  .green { color: #34d399; }
  .amber { color: #fbbf24; }
  footer { padding: 0 32px 24px; color: #64748b; font-size: 10px; }
  @media (max-width: 860px) {
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>

<section class="cards">

      <li>一部云手机，不用手填端口</li>
      <li>借现成项目完成装包和点一步</li>
